[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thegavel"
version = "0.1.0"
description = "Rubric judging by reading rating probabilities instead of generating text."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/michaelinghilterra-creator/TheGavel"
Source = "https://github.com/michaelinghilterra-creator/TheGavel"
Issues = "https://github.com/michaelinghilterra-creator/TheGavel/issues"

[project.scripts]
gavel = "gavel.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
native = ["torch>=2.4", "transformers>=5.12,<6"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gavel", "gavel.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
