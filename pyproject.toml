[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gavel"
version = "0.0.1"
description = "Rubric judging by reading rating probabilities instead of generating text."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
gavel = "gavel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gavel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
